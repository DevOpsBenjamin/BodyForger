name: Android & Wear OS CI

# Pull requests only. A merge into main builds nothing: what main produces is a
# release, and that is driven by a tag or a version bump — see release.yml.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build APKs & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      # Android Studio runs lint as part of its build, so an error here breaks the IDE while
      # `test` and `assembleDebug` stay green. Running it in CI keeps the two in step.
      - name: Run Lint
        run: ./gradlew lintDebug --stacktrace

      # Nothing is uploaded: the point is that it compiles. Installable APKs
      # belong to a release, and the app is run from Android Studio anyway.
      - name: Build Debug APKs (Mobile & Wear OS)
        run: ./gradlew assembleDebug --stacktrace
