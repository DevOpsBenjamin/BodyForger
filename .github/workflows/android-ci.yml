name: Android & Wear OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build APKs & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Build Debug APKs (Mobile & Wear OS)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: app-mobile-debug
          path: app-mobile/build/outputs/apk/debug/*.apk

      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v4
        with:
          name: app-wear-debug
          path: app-wear/build/outputs/apk/debug/*.apk
