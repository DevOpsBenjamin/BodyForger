<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141519" />
      <stop offset="100%" stop-color="#0A0A0C" />
    </linearGradient>

    <!-- Neon Energy Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FF4D" />
      <stop offset="100%" stop-color="#CCFF00" />
    </linearGradient>

    <!-- Electric Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00A3FF" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#22252B" stroke-width="2" />

  <!-- Subtle Precision Hex Grid Background -->
  <path d="M256,40 L450,148 L450,364 L256,472 L62,364 L62,148 Z" fill="none" stroke="#1A1C22" stroke-width="3" stroke-dasharray="8 8" />

  <!-- BodyForger Forged Emblem ("B" & "F" Forge Bolt / Anvil & Pulse) -->
  <g transform="translate(0, 0)">
    <!-- Central Forged Lightning Core (Strength / Workout) -->
    <path d="M276,88 L172,260 L248,260 L220,424 L340,232 L264,232 Z" 
          fill="url(#neonGrad)" 
          filter="url(#neonGlow)" />

    <!-- Left Arm / BIA Electrodes Bracket (Bio-Impedance Precision) -->
    <path d="M144,168 L108,192 L108,320 L144,344" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    
    <circle cx="108" cy="256" r="10" fill="#00F0FF" />

    <!-- Right Arm / BIA Electrodes Bracket (Bio-Impedance Precision) -->
    <path d="M368,168 L404,192 L404,320 L368,344" 
          fill="none" 
          stroke="url(#cyanGrad)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <circle cx="404" cy="256" r="10" fill="#00F0FF" />
  </g>
</svg>
